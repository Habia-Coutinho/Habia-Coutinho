<svg width="900" height="250" viewBox="0 0 900 250"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="250" fill="#0D0D0D"/>

  <circle cx="100" cy="80" r="3" fill="#7C3AED">
    <animate
      attributeName="cy"
      values="80;60;80"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="170" r="3" fill="#7C3AED">
    <animate
      attributeName="cy"
      values="170;145;170"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

  <text
    x="450"
    y="115"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="48"
    font-weight="bold"
    letter-spacing="5">
    HÁBIA COUTINHO

    <animate
      attributeName="opacity"
      values="0;1;1"
      dur="2s"
      repeatCount="indefinite"/>
  </text>

  <text
    x="450"
    y="155"
    text-anchor="middle"
    fill="#7C3AED"
    font-family="Arial, sans-serif"
    font-size="20">
    Front-End Developer em formação
  </text>

  <line
    x1="250"
    y1="180"
    x2="650"
    y2="180"
    stroke="#7C3AED"
    stroke-width="2">

    <animate
      attributeName="x1"
      values="250;300;250"
      dur="3s"
      repeatCount="indefinite"/>

  </line>

</svg>